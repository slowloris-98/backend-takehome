[package]
name = "backend-takehome"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# web framework and dependency
axum = "0.6"
tokio = { version = "1.0", features = ["full"] }

# web client
reqwest = { version = "0.11", features = ["json"] }

# (de)serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# misc (middleware, time, etc. -- other things you might need)
chrono = "0.4"
version-compare = "0.1.1"
tower-http = { version = "0.4", features = ["cors", "trace"] }
http = "0.2"

# typed errors -> distinct status codes (see services::jamf::JamfError)
thiserror = "1"

# .env loading (populates the process env; see JamfClient::from_env)
dotenv = "0.15"

# structured logging. tracing itself is already in the graph transitively (hyper,
# tower, reqwest); declaring it just makes it nameable. tracing-subscriber is the
# only genuinely new tree -- 0.3 is the generation axum 0.6 / tower-http 0.4 share
# a tracing-core with. env-filter is the one non-default feature we need; fmt,
# ansi and tracing-log are already on by default.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
